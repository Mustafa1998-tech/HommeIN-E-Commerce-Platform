<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - HommeIN</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo">HommeIN</a>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">الرئيسية</a></li>
                    <li><a href="/products" class="nav-link">المنتجات</a></li>
                    <li><a href="/cart" class="nav-link" style="position: relative;">
                            السلة
                            <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                        </a></li>
                </ul>
                <div id="auth-buttons" class="flex gap-2"></div>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 3rem 0;">
        <div id="product-detail" style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;"></div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script>
        async function loadProduct() {
            const productId = parseInt(window.location.pathname.split('/').pop());

            try {
                const product = await api.getProduct(productId);
                const container = document.getElementById('product-detail');

                const sizes = product.sizes ? product.sizes.split(',') : [];
                const colors = product.colors ? product.colors.split(',') : [];

                container.innerHTML = `
                    <div>
                        <img src="${product.image_url || 'https://via.placeholder.com/600'}" style="width: 100%; border-radius: var(--radius-lg);">
                    </div>
                    <div>
                        <h1>${product.name}</h1>
                        ${product.brand ? `<p style="color: var(--text-secondary); font-size: 1.125rem;">${product.brand}</p>` : ''}
                        
                        <div style="margin: 2rem 0;">
                            <span class="price">${formatPrice(product.sale_price || product.price)}</span>
                            ${product.sale_price ? `<span class="price-old">${formatPrice(product.price)}</span>` : ''}
                        </div>

                        ${product.description ? `<p style="color: var(--text-secondary); margin: 1.5rem 0;">${product.description}</p>` : ''}

                        ${sizes.length > 0 ? `
                            <div style="margin: 1.5rem 0;">
                                <label class="form-label">المقاس</label>
                                <select id="size-select" class="form-select">
                                    ${sizes.map(size => `<option value="${size.trim()}">${size.trim()}</option>`).join('')}
                                </select>
                            </div>
                        ` : ''}

                        ${colors.length > 0 ? `
                            <div style="margin: 1.5rem 0;">
                                <label class="form-label">اللون</label>
                                <select id="color-select" class="form-select">
                                    ${colors.map(color => `<option value="${color.trim()}">${color.trim()}</option>`).join('')}
                                </select>
                            </div>
                        ` : ''}

                        <div style="margin: 1.5rem 0;">
                            <label class="form-label">الكمية</label>
                            <input type="number" id="quantity-input" class="form-input" value="1" min="1" max="${product.stock_quantity}">
                        </div>

                        ${product.is_available ? `
                            <button onclick="addToCart()" class="btn btn-primary" style="width: 100%; font-size: 1.125rem; padding: 1rem;">
                                إضافة إلى السلة
                            </button>
                        ` : `
                            <button class="btn btn-outline" style="width: 100%; cursor: not-allowed;" disabled>
                                غير متوفر
                            </button>
                        `}

                        <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
                            <p><strong>الكمية المتوفرة:</strong> ${product.stock_quantity}</p>
                            ${product.sku ? `<p><strong>رمز المنتج:</strong> ${product.sku}</p>` : ''}
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('product-detail').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 0;">
                        <h2>المنتج غير موجود</h2>
                        <a href="/products" class="btn btn-primary" style="margin-top: 1rem;">العودة للمنتجات</a>
                    </div>
                `;
            }
        }

        async function addToCart() {
            const productId = parseInt(window.location.pathname.split('/').pop());
            const quantity = parseInt(document.getElementById('quantity-input').value);
            const size = document.getElementById('size-select')?.value || null;
            const color = document.getElementById('color-select')?.value || null;

            await cart.addToCart(productId, quantity, size, color);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await cart.loadCart();
            await loadProduct();
        });
    </script>
</body>

</html>
