version: '3.8'

services:
  hommein:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./hommein.db
    volumes:
      - ./hommein.db:/app/hommein.db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - hommein
    restart: unless-stopped
